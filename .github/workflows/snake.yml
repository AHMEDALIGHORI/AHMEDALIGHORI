name: Generate Snake Animation

on:
  # Scheduled runs are intentionally disabled. GitHub Actions is currently
  # blocked on this account by a billing lock, so every nightly run failed
  # before a single step started ("The job was not started because your
  # account is locked due to a billing issue") — one failure notification
  # per day, with no snake produced.
  #
  # Once Actions can run again, restore the nightly schedule by un-commenting
  # the two lines below, then check that the `output` branch appears and
  # un-comment the snake image block near the end of README.md.
  #
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snake@v3
        id: snake-gif
        with:
          github_user_name: AHMEDALIGHORI
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
