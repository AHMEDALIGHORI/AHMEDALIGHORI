<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="acTitle acDesc">
  <title id="acTitle">AgentChaos adversarial test path</title>
  <desc id="acDesc">Six stages: an agent under test runs against a controlled tool, a payload set is selected, attacks are injected into tool responses, the agent's next action is observed, security boundaries are checked for unsafe behaviour, and the failure is written up as a reproducible report.</desc>

  <defs>
    <linearGradient id="acPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1412"/>
      <stop offset="55%" stop-color="#0d1a16"/>
      <stop offset="100%" stop-color="#0f1412"/>
    </linearGradient>
    <linearGradient id="acAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#d7ff3f"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="acGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f6f6f0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="acArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#34d399"/>
    </marker>
    <filter id="acGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#acPanel)" stroke="#34d399" stroke-opacity="0.32"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#acGrid)"/>

  <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="square" opacity="0.65">
    <path d="M26 60 L26 26 L60 26"/>
    <path d="M1140 26 L1174 26 L1174 60"/>
    <path d="M26 240 L26 274 L60 274"/>
    <path d="M1140 274 L1174 274 L1174 240"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
  </g>

  <text x="44" y="48" fill="#34d399" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13.5" font-weight="600" letter-spacing="3.6" filter="url(#acGlow)">AGENTCHAOS &#8212; ADVERSARIAL TEST PATH</text>
  <text x="44" y="72" fill="#8a8a82" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11.5" letter-spacing="1.4">attack your own agent first &#183; controlled payloads &#183; reproducible failures</text>

  <g stroke="#34d399" stroke-width="1.6" marker-end="url(#acArrow)">
    <line x1="210" y1="164" x2="232" y2="164" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="408" y1="164" x2="430" y2="164" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="606" y1="164" x2="628" y2="164" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="804" y1="164" x2="826" y2="164" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="1002" y1="164" x2="1024" y2="164" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
    <g>
      <rect x="30" y="126" width="180" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.045" stroke="#34d399" stroke-opacity="0.75"/>
      <text x="46" y="150" fill="#34d399" font-size="10" letter-spacing="2">01</text>
      <text x="46" y="172" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">AGENT + TOOLS</text>
      <text x="46" y="190" fill="#8a8a82" font-size="10">the system under test</text>
    </g>
    <g>
      <rect x="232" y="126" width="176" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.045" stroke="#d7ff3f" stroke-opacity="0.7"/>
      <text x="248" y="150" fill="#34d399" font-size="10" letter-spacing="2">02</text>
      <text x="248" y="172" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">PAYLOAD SET</text>
      <text x="248" y="190" fill="#8a8a82" font-size="10">scoped, repeatable attacks</text>
    </g>
    <g>
      <rect x="430" y="126" width="176" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.045" stroke="#34d399" stroke-opacity="0.75"/>
      <text x="446" y="150" fill="#34d399" font-size="10" letter-spacing="2">03</text>
      <text x="446" y="172" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">INJECTION</text>
      <text x="446" y="190" fill="#8a8a82" font-size="10">hidden in tool output</text>
    </g>
    <g>
      <rect x="628" y="126" width="176" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.045" stroke="#d7ff3f" stroke-opacity="0.7"/>
      <text x="644" y="150" fill="#34d399" font-size="10" letter-spacing="2">04</text>
      <text x="644" y="172" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">OBSERVE</text>
      <text x="644" y="190" fill="#8a8a82" font-size="10">what the agent does next</text>
    </g>
    <g>
      <rect x="826" y="126" width="176" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.045" stroke="#34d399" stroke-opacity="0.75"/>
      <text x="842" y="150" fill="#34d399" font-size="10" letter-spacing="2">05</text>
      <text x="842" y="172" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">BOUNDARY CHECK</text>
      <text x="842" y="190" fill="#8a8a82" font-size="10">did a trust boundary break?</text>
    </g>
    <g>
      <rect x="1024" y="126" width="146" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.045" stroke="#d7ff3f" stroke-opacity="0.7"/>
      <text x="1040" y="150" fill="#34d399" font-size="10" letter-spacing="2">06</text>
      <text x="1040" y="172" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">REPORT</text>
      <text x="1040" y="190" fill="#8a8a82" font-size="10">reproducible failure</text>
    </g>
  </g>

  <rect x="30" y="228" width="1120" height="1" fill="url(#acAccent)" opacity="0.35"/>
  <text x="44" y="252" fill="#b8b8b0" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11" letter-spacing="0.8">TypeScript CLI &#183; MIT licence &#183; local-first &#183; controlled attacks &#183; runs entirely on your machine</text>
  <text x="44" y="272" fill="#8a8a82" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="10.5" letter-spacing="0.6">purpose: find the break before an attacker does &#8195;|&#8195; same input, same failure, every single run</text>
</svg>

