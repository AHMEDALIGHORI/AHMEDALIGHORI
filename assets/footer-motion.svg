<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-label="Animated divider">
  <!--
    NOTE: every gradient here uses gradientUnits="userSpaceOnUse".
    The previous version applied an objectBoundingBox gradient to a horizontal
    <line>, whose bounding box has zero height — a degenerate gradient, so the
    line was never painted and only the dots showed up. Do not remove these.
  -->
  <defs>
    <linearGradient id="fLine" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="1200" y2="40">
      <stop offset="0%"   stop-color="#ef4d2f" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#ef4d2f" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#d7ff3f"/>
      <stop offset="82%"  stop-color="#ef4d2f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4d2f" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fGlow" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="220" y2="40">
      <stop offset="0%"   stop-color="#d7ff3f" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#d7ff3f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d7ff3f" stop-opacity="0"/>
    </linearGradient>

    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base rule: a rect, not a line, so the gradient box always has area -->
  <rect x="0" y="39" width="1200" height="2" rx="1" fill="url(#fLine)">
    <animate attributeName="height" values="1.6;2.6;1.6" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="39.2;38.7;39.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- travelling highlight -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-220 0; 1200 0" dur="6s" repeatCount="indefinite"/>
    <rect x="0" y="38.5" width="220" height="3" rx="1.5" fill="url(#fGlow)"/>
  </g>

  <!-- tick marks -->
  <g stroke="#f6f6f0" stroke-opacity="0.14" stroke-width="1">
    <path d="M300 32v16M450 34v12M750 34v12M900 32v16"/>
  </g>

  <!-- central node -->
  <circle cx="600" cy="40" r="5" fill="#d7ff3f" filter="url(#fBlur)">
    <animate attributeName="r" values="4;7.5;4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="11" fill="none" stroke="#d7ff3f" stroke-width="1">
    <animate attributeName="r" values="8;22;8" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting satellites -->
  <circle cy="40" r="2.4" fill="#ef4d2f">
    <animate attributeName="cx" values="470;730;470" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="40" r="2.4" fill="#ef4d2f">
    <animate attributeName="cx" values="730;470;730" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
