<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="noorTitle noorDesc">
  <title id="noorTitle">Noor Islamic Companion retrieval path</title>
  <desc id="noorDesc">Six stages: a question in English or Urdu, multilingual embedding, cosine similarity search over pre-cached source embeddings, hybrid ranking with a lexical fallback, the top eight passages injected into the prompt, and a grounded answer returned with citations and relevance scores.</desc>

  <defs>
    <linearGradient id="nPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1a15"/>
      <stop offset="55%" stop-color="#101f19"/>
      <stop offset="100%" stop-color="#0b1512"/>
    </linearGradient>
    <linearGradient id="nAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f6b52"/>
      <stop offset="50%" stop-color="#d7ff3f"/>
      <stop offset="100%" stop-color="#0f6b52"/>
    </linearGradient>
    <pattern id="nGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f6f6f0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="nArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#2fbf8f"/>
    </marker>
    <filter id="nGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#nPanel)" stroke="#0f6b52" stroke-opacity="0.85"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#nGrid)"/>

  <g fill="none" stroke="#2fbf8f" stroke-width="2" stroke-linecap="square" opacity="0.6">
    <path d="M26 60 L26 26 L60 26"/>
    <path d="M1140 26 L1174 26 L1174 60"/>
    <path d="M26 240 L26 274 L60 274"/>
    <path d="M1140 274 L1174 274 L1174 240"/>
    <animate attributeName="opacity" values="0.28;0.75;0.28" dur="6s" repeatCount="indefinite"/>
  </g>

  <text x="44" y="48" fill="#d7ff3f" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13.5" font-weight="600" letter-spacing="3.6" filter="url(#nGlow)">NOOR &#8212; RETRIEVAL PATH</text>
  <text x="44" y="72" fill="#7fae9c" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11.5" letter-spacing="1.4">answers retrieve verified sources first, then generate &#183; English + Urdu</text>

  <g stroke="#2fbf8f" stroke-width="1.6" marker-end="url(#nArrow)">
    <line x1="200" y1="164" x2="222" y2="164" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="396" y1="164" x2="418" y2="164" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="592" y1="164" x2="614" y2="164" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="788" y1="164" x2="810" y2="164" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="984" y1="164" x2="1006" y2="164" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
  </g>
  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
    <g>
      <rect x="30" y="126" width="170" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.05" stroke="#0f6b52" stroke-opacity="0.9"/>
      <text x="47" y="150" fill="#7fe6c0" font-size="9.5" letter-spacing="1.8">01</text>
      <text x="47" y="171" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">QUESTION</text>
      <text x="47" y="189" fill="#8a8a82" font-size="10">English or Urdu</text>
    </g>
    <g>
      <rect x="226" y="126" width="170" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.05" stroke="#d7ff3f" stroke-opacity="0.65"/>
      <text x="243" y="150" fill="#7fe6c0" font-size="9.5" letter-spacing="1.8">02</text>
      <text x="243" y="171" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">EMBEDDING</text>
      <text x="243" y="189" fill="#8a8a82" font-size="10">MiniLM multilingual</text>
    </g>
    <g>
      <rect x="422" y="126" width="170" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.05" stroke="#0f6b52" stroke-opacity="0.9"/>
      <text x="439" y="150" fill="#7fe6c0" font-size="9.5" letter-spacing="1.8">03</text>
      <text x="439" y="171" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">COSINE SEARCH</text>
      <text x="439" y="189" fill="#8a8a82" font-size="10">cached source vectors</text>
    </g>
    <g>
      <rect x="618" y="126" width="170" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.05" stroke="#d7ff3f" stroke-opacity="0.65"/>
      <text x="635" y="150" fill="#7fe6c0" font-size="9.5" letter-spacing="1.8">04</text>
      <text x="635" y="171" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">HYBRID RANK</text>
      <text x="635" y="189" fill="#8a8a82" font-size="10">semantic + lexical</text>
    </g>
    <g>
      <rect x="814" y="126" width="170" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.05" stroke="#0f6b52" stroke-opacity="0.9"/>
      <text x="831" y="150" fill="#7fe6c0" font-size="9.5" letter-spacing="1.8">05</text>
      <text x="831" y="171" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">TOP-8 PROMPT</text>
      <text x="831" y="189" fill="#8a8a82" font-size="10">grounding context</text>
    </g>
    <g>
      <rect x="1010" y="126" width="170" height="76" rx="12" fill="#f6f6f0" fill-opacity="0.05" stroke="#d7ff3f" stroke-opacity="0.65"/>
      <text x="1027" y="150" fill="#7fe6c0" font-size="9.5" letter-spacing="1.8">06</text>
      <text x="1027" y="171" fill="#f6f6f0" font-size="12.5" font-weight="600" letter-spacing="0.5">CITED ANSWER</text>
      <text x="1027" y="189" fill="#8a8a82" font-size="10">sources + scores</text>
    </g>
  </g>

  <rect x="30" y="228" width="1150" height="1" fill="url(#nAccent)" opacity="0.4"/>
  <text x="44" y="252" fill="#b8b8b0" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11" letter-spacing="0.8">28 verified source records &#183; paraphrase-multilingual-MiniLM-L12-v2 &#183; 8s retrieval timeout</text>
  <text x="44" y="272" fill="#7fae9c" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="10.5" letter-spacing="0.6">refuses to present itself as a mufti &#183; routes high-stakes questions to qualified scholars</text>
</svg>

